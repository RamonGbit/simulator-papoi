[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simulator-papoi"
version = "1.0.0"
description = "Simulador de Optimización para Redes de Centros de Datos (DataStream Networks)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Equipo de Desarrollo UJAP"}
]
dependencies = [
    "simpy>=4.1.1",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "sympy>=1.12.0",
    "pygame>=2.5.0",
    "matplotlib>=3.8.0",
    "reportlab>=4.1.0",
    "requests>=2.31.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "pytest>=8.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
